<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRACTICE 14 SEP</title>
    <style>
        /* Estilos generales con fondo en gradiente azul profundo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #070d19 0%, #0f172a 50%, #002855 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tarjeta contenedora con efecto cristal y borde azul brillante */
        .card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 2.5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 102, 255, 0.15), 0 5px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-top: 1px solid rgba(56, 189, 248, 0.5);
        }

        /* Encabezado principal azul cian */
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 2rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        /* Contenedor de botones en columna */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        /* Estilo del enlace transformado en botón azul */
        .btn {
            display: block;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%);
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 0.5px;
        }

        /* Efecto hover/foco del botón con resplandor neón */
        .btn:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.5);
            color: #ffffff;
        }

        /* Efecto al hacer clic */
        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }

        /* Nombre del autor/estudiante */
        h2 {
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 400;
            margin: 0;
            border-top: 1px solid rgba(51, 65, 85, 0.8);
            padding-top: 1.2rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>

        </div>

        <h2>Ramirez Ramos Juan Fernando</h2>
    </div>

</body>
